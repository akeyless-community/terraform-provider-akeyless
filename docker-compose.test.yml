services:
  akeyless-gateway:
    image: akeyless/base:latest-akeyless
    platform: linux/amd64
    restart: on-failure
    ports:
      - "8000:8000"
      - "8080:8080"
      - "8081:8081"
    environment:
      ADMIN_ACCESS_ID: ${AKEYLESS_ACCESS_ID}
      ADMIN_ACCESS_KEY: ${AKEYLESS_ACCESS_KEY}
      BYPASS_DRY_RUN: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "-X", "POST", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  akeyless-gateway-config:
    image: akeyless/base:latest-akeyless
    platform: linux/amd64
    restart: on-failure
    profiles: ["gateway-config"]
    ports:
      - "9000:8000"
      - "9080:8080"
      - "9081:8081"
      - "19888:18888"
    environment:
      ADMIN_ACCESS_ID: ${AKEYLESS_ACCESS_ID}
      ADMIN_ACCESS_KEY: ${AKEYLESS_ACCESS_KEY}
      BYPASS_DRY_RUN: "true"
      CLUSTER_NAME: "gateway-config-tests"
    healthcheck:
      test: ["CMD", "curl", "-sf", "-X", "POST", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  vault:
    image: hashicorp/vault:1.17
    platform: linux/amd64
    ports:
      - "18200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "test"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  mysql:
    image: mysql:8
    platform: linux/amd64
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
