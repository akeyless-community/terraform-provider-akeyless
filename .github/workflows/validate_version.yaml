name: Validate Release

on:
  pull_request:


jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AKEYLESS_CI_GITHUB_TOKEN }}

      - name: Fetch history
        run: git fetch --prune --unshallow

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Validate Release Version
        run: .github/scripts/validate_release_version.sh

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.0.1
          terraform_wrapper: false

      - name: Set up GO
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
        id: go

      - name: Checkout akeyless-main-repo
        uses: actions/checkout@v4
        with:
          repository: akeylesslabs/akeyless-main-repo
          path: akeyless-main-repo
          token: ${{ secrets.AKEYLESS_CI_GITHUB_TOKEN }}

      - name: Start local gateway
        env:
          API_GW_TEST_ACC_ID: ${{ secrets.AKEYLESS_ACCESS_ID }}
          API_GW_TEST_ACC_KEY: ${{ secrets.AKEYLESS_ACCESS_KEY }}
        run: |
          compose_file="${{ github.workspace }}/akeyless-main-repo/.github/scripts/sanity-tests/api-gw/docker-compose.yml"
          cluster_name=$(openssl rand -base64 12 | tr /+ A)
          sed -i "s/__CLUSTER_NAME__/${cluster_name}/g" "${compose_file}"
          sed -i "s/__API_GW_TEST_ACC_ID__/${API_GW_TEST_ACC_ID}/g" "${compose_file}"
          sed -i "s/__API_GW_TEST_ACC_KEY__/${API_GW_TEST_ACC_KEY}/g" "${compose_file}"
          docker compose -f "${compose_file}" -p api-gw-acc-tests pull
          docker compose -f "${compose_file}" -p api-gw-acc-tests up -d api-gw1
          sleep 30
          docker network connect bridge api_gw_compose || true
          docker restart api_gw_compose
          ready="false"
          for i in $(seq 1 18); do
            echo "Waiting for gateway curl proxy on http://127.0.0.1:8080 (attempt ${i}/18)..."
            if curl --output /dev/null --silent --fail -d "cmd=help" http://127.0.0.1:8080; then
              echo "Gateway curl proxy is up."
              ready="true"
              break
            fi
            sleep 10
          done
          if [[ "${ready}" != "true" ]]; then
            echo "Gateway did not become ready in time. Container status:"
            docker ps -a
            echo "Gateway logs (api_gw_compose):"
            docker logs api_gw_compose || true
            exit 1
          fi

      - name: Run Acceptance Tests
        env:
          AKEYLESS_GATEWAY: http://127.0.0.1:8080/v2
          AKEYLESS_ACCESS_ID: ${{ secrets.AKEYLESS_ACCESS_ID }}
          AKEYLESS_ACCESS_KEY: ${{ secrets.AKEYLESS_ACCESS_KEY }}
          TF_ACC_GCP_SERVICE_ACCOUNT: ${{ secrets.TF_ACC_GCP_SERVICE_ACCOUNT }}
          TF_ACC_GCP_BOUND_SERVICE_ACC: ${{ secrets.TF_ACC_GCP_BOUND_SERVICE_ACC }}
        run: |
          TF_ACC=1 go test ./... -v -count 1 -timeout 120m

      - name: Stop local gateway
        if: always()
        run: |
          compose_file="${{ github.workspace }}/akeyless-main-repo/.github/scripts/sanity-tests/api-gw/docker-compose.yml"
          docker compose -f "${compose_file}" -p api-gw-acc-tests stop || true
          docker compose -f "${compose_file}" -p api-gw-acc-tests rm -f || true