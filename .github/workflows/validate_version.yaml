name: Validate Release

on:
  pull_request:


jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AKEYLESS_CI_GITHUB_TOKEN }}

      - name: Fetch history
        run: git fetch --prune --unshallow

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Validate Release Version
        run: .github/scripts/validate_release_version.sh

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.0.1
          terraform_wrapper: false

      - name: Set up GO
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version-file: go.mod
        id: go

      - name: Start local gateway
        env:
          GATEWAY_ACCESS_ID: ${{ secrets.AKEYLESS_ACCESS_ID }}
          GATEWAY_ACCESS_KEY: ${{ secrets.AKEYLESS_ACCESS_KEY }}
        run: |
          docker pull akeyless/base:latest
          docker rm -f gateway || true
          docker run -d \
            -p 8000:8000 -p 8200:8200 -p 18888:18888 -p 8080:8080 -p 8081:8081 -p 5696:5696 \
            -e GATEWAY_ACCESS_ID="${GATEWAY_ACCESS_ID}" \
            -e GATEWAY_ACCESS_KEY="${GATEWAY_ACCESS_KEY}" \
            -e AKEYLESS_URL="https://vault.akeyless.io" \
            --name gateway akeyless/base:latest
          ready="false"
          for i in $(seq 1 20); do
            echo "Waiting for gateway curl proxy on http://127.0.0.1:8080 (attempt ${i}/20)..."
            if curl --output /dev/null --silent --fail -d "cmd=help" http://127.0.0.1:8080; then
              echo "Gateway curl proxy is up."
              ready="true"
              break
            fi
            sleep 10
          done
          if [[ "${ready}" != "true" ]]; then
            echo "Gateway did not become ready in time. Container status:"
            docker ps -a
            echo "Gateway logs:"
            docker logs gateway || true
            exit 1
          fi

      - name: Run Acceptance Tests
        env:
          AKEYLESS_GATEWAY: http://127.0.0.1:8080/v2
          AKEYLESS_ACCESS_ID: ${{ secrets.AKEYLESS_ACCESS_ID }}
          AKEYLESS_ACCESS_KEY: ${{ secrets.AKEYLESS_ACCESS_KEY }}
          TF_ACC_GCP_SERVICE_ACCOUNT: ${{ secrets.TF_ACC_GCP_SERVICE_ACCOUNT }}
          TF_ACC_GCP_BOUND_SERVICE_ACC: ${{ secrets.TF_ACC_GCP_BOUND_SERVICE_ACC }}
        run: |
          TF_ACC=1 go test ./... -v -count 1 -timeout 120m

      - name: Stop local gateway
        if: always()
        run: |
          docker logs gateway || true
          docker rm -f gateway || true