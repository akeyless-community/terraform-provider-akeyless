version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "terraform"
    directories:
      - "/examples"
      - "/examples/data-sources/akeyless_auth_method"
      - "/examples/data-sources/akeyless_dynamic_secret"
      - "/examples/data-sources/akeyless_role"
      - "/examples/data-sources/akeyless_secret"
      - "/examples/data-sources/akeyless_static_secret"
      - "/examples/provider"
      - "/examples/resources/akeyless_auth_method"
      - "/examples/resources/akeyless_auth_method_saml"
      - "/examples/resources/akeyless_role"
      - "/examples/resources/akeyless_static_secret"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
